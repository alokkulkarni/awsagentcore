services:
  brainstorm-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    container_name: brainstorm-agent
    env_file:
      - .env
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_REGION: ${AWS_REGION:-eu-west-2}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-2}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-eu.anthropic.claude-sonnet-4-6}
      DB_PATH: /app/data/brainstorm.db
    volumes:
      - brainstorm_data:/app/data
      - ${HOME}/.aws:/root/.aws:ro
    ports:
      - "8000:8200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  brainstorm-frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: brainstorm-frontend
    ports:
      - "3000:5175"
    depends_on:
      - brainstorm-agent
    restart: unless-stopped

volumes:
  brainstorm_data:
