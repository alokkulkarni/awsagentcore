name: Integration Tests

on:
  workflow_run:
    workflows: ['{{TRIGGER_WORKFLOW_NAME}}']
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Target env
        default: '{{DEFAULT_ENV}}'
      base_url:
        description: Base URL for tests

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
{{INTEGRATION_STEPS}}
