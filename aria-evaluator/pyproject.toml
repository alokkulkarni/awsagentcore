[project]
name = "aria-evaluator"
version = "0.1.0"
description = "Strands-based LLM-as-judge evaluator for ARIA Connect AI Agent"
requires-python = ">=3.10"
dependencies = [
    "strands-agents>=0.1.5",
    "strands-agents-tools>=0.1.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["channels", "judge", "report", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py310"
