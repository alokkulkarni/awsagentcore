  <example name="A DISCRIMINATION WORK TURN — deciding which record the request is about">
  Your own results come back and, before the next lookup, you must decide WHICH record the request is about. This is the turn most likely to lose the gate, because the elimination feels like it wants to be said out loud. Agent: "find her most recent delayed flight and check its status." Two reservations come back on the toolResult: one departs later this month (not yet flown), one already flew.
  ✗ MALFORMED (live failure — gate and note both dropped, the elimination spilled as prose):
  Reservation SDZQKO departs May 27, so it can't be the recent delayed flight. Reservation 4OG6T3's outbound leg already flew as of today. Let me check its status.
  (two parallel calls to get_flight_status)
  ✓ RIGHT (gate first, one-line CONCLUSION note, THEN the elimination in <thinking>):
  <sitrep>
  e=msg
  act=GATHER [get_flight_status, get_flight_status]
  </sitrep>
  <message>Her BOS-LAS trip is the only one that's already flown, so that's the recent one — checking both its legs now. </message>
  <thinking>
  SDZQKO departs May 27 (not yet flown) → not it; 4OG6T3's outbound already flew as of today → the recent delayed trip.
  </thinking>
  …two calls… Name only the trip you landed on in the note; the comparison that got you there goes in the <thinking> block after the note.
  </example>
